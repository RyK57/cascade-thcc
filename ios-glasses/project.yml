name: CascadeGlasses
options:
  bundleIdPrefix: com.cascade
  deploymentTarget:
    iOS: "17.0"

packages:
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 0.8.0

targets:
  CascadeGlasses:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATCamera
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cascade.glasses
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Cascade Glasses
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: Push-to-talk voice commands for Cascade.
        NSSpeechRecognitionUsageDescription: Transcribes your voice commands on-device.
        NSCameraUsageDescription: Phone-camera fallback when glasses are not connected.
        NSBluetoothAlwaysUsageDescription: Needed to connect to Meta AI Glasses.
        NSLocalNetworkUsageDescription: This allows your phone to find and connect to your glasses over Wi-Fi.
        NSBonjourServices: [_bonjour._tcp]
        UIBackgroundModes: [processing, bluetooth-central, bluetooth-peripheral]
        LSApplicationQueriesSchemes: [fb-viewapp]
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.cascade.glasses
            CFBundleURLSchemes: [cascadeglasses]
        MWDAT:
          AppLinkURLScheme: "cascadeglasses://"
          MetaAppID: "0"
    entitlements:
      path: CascadeGlasses.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.cascade.glasses
        com.apple.developer.networking.HotspotConfiguration: true
        com.apple.developer.networking.wifi-info: true
